<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QRIS Dinamis - SM RESIDENCE QR</title>
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
    color: #000000;
    margin: 0;
    padding: 16px;
  }
  body.dark {
    background: #0f172a;
    color: #e5e7eb;
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    color: #1f3f7a;
  }
  .eagle {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #c00000;
    color: white;
    display: grid;
    place-items: center;
    font-weight: 800;
    font-size: 12px;
    text-align: center;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-mark {
    width: 42px;
    height: 42px;
    background: #000000;
    color: white;
    display: grid;
    place-items: center;
    font-weight: 800;
    font-size: 10px;
    letter-spacing: 1px;
    text-align: center;
  }
  .logo-text {
    font-size: 12px;
    line-height: 1.3;
  }
  .logo-text strong {
    display: block;
    font-size: 15px;
  }
  h1 {
    font-size: 24px;
    text-align: center;
    margin: 10px 0 0;
    letter-spacing: 0.5px;
  }
  .nmid {
    text-align: center;
    color: #5c5c5c;
    margin: 4px 0 14px;
  }
  .card {
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 16px;
    background: #ffffff;
  }
  .card label {
    display: block;
    font-size: 13px;
    margin-bottom: 6px;
    color: #5c5c5c;
  }
  .card input, .card textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #c8c8c8;
    border-radius: 6px;
    margin-bottom: 12px;
    font-size: 14px;
    outline: none;
  }
  .card input:focus, .card textarea:focus {
    border-color: #1f3f7a;
  }
  .actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  button {
    padding: 10px 14px;
    border-radius: 6px;
    border: none;
    background: #1f3f7a;
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  button.ghost {
    background: transparent;
    color: black;
    border: 1px solid #c8c8c8;
  }
  body.dark button.ghost {
    color: white;
    border-color: #475569;
    background: transparent;
  }
  .qr-result {
    margin-top: 16px;
    text-align: center;
    display: none;
  }
  .qr-result img {
    max-width: 100%;
  }
  .status {
    margin-top: 12px;
    font-size: 13px;
    display: none;
  }
  .status.error {
    display: block;
    color: #b91c1c;
  }
  .status.success {
    display: block;
    color: #047857;
  }
  .footer {
    margin-top: 18px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 16px;
    align-items: start;
  }
  .meta {
    font-size: 11px;
    color: #5c5c5c;
  }
  .how h3 {
    margin: 0 0 8px;
    font-size: 13px;
  }
  .steps {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .steps li {
    display: flex;
    gap: 10px;
    font-size: 13px;
  }
  .circle {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #e5e7eb;
    display: grid;
    place-items: center;
    font-weight: 700;
    flex-shrink: 0;
  }
  .theme {
    margin-top: 12px;
    display: flex;
    gap: 8px;
  }
  .theme button {
    padding: 6px 10px;
    font-size: 12px;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <div class="logo-mark">QRIS</div>
        <div class="logo-text">
          <div>QR Code Standar</div>
          <div>Pembayaran Nasional</div>
        </div>
      </div>
      <div class="brand">
        <div class="eagle">GPN</div>
        <div>SM RESIDENCE QR</div>
      </div>
    </div>

    <h1>SM RESIDENCE QR</h1>
    <div class="nmid">NMID : ID1022190806854</div>

    <div class="card">
      <label for="amount">Nominal (Rp)</label>
      <textarea id="amount" rows="1">10000</textarea>
      <label for="qris_statis">QRIS Statis</label>
      <textarea id="qris_statis" rows="4">00020101021126650013ID.CO.BCA.WWW011893600014000164458002150008850016445800303UMI51440014ID.CO.QRIS.WWW0215ID10221908068540303UMI5204701253033605802ID5915SM RESIDENCE QR6007BANDUNG61054016362070703A016304D32F</textarea>
      <div class="actions">
        <button class="ghost" id="btnClear" type="button">Reset</button>
        <button id="btnGenerate" type="button">Buat QRIS</button>
      </div>
    </div>

    <div class="qr-result" id="qrResult">
      <img id="qrImage" alt="QRIS Dinamis" />
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>

    <div class="footer">
      <div class="meta">
        <div>Dicetak oleh : 93600014</div>
        <div>Versi Cetak : 1.0-2022.07.01</div>
      </div>
      <div class="how">
        <h3>Cara bayar dengan QRIS:</h3>
        <ul class="steps">
          <li>
            <span class="circle">1</span>
            <span>Buka Aplikasi Berlogo QRIS</span>
          </li>
          <li>
            <span class="circle">2</span>
            <span>Scan &amp; Cek</span>
          </li>
          <li>
            <span class="circle">3</span>
            <span>Bayar</span>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://qrisku.my.id/api';
    const elements = {
      amount: document.getElementById('amount'),
      qrisStatis: document.getElementById('qris_statis'),
      btnGenerate: document.getElementById('btnGenerate'),
      btnClear: document.getElementById('btnClear'),
      status: document.getElementById('status'),
      qrResult: document.getElementById('qrResult'),
      qrImage: document.getElementById('qrImage')
    };

    function setStatus(message, type) {
      const el = elements.status;
      el.textContent = message;
      el.className = 'status ' + type;
    }

    function hideQR() {
      elements.qrResult.style.display = 'none';
      elements.qrImage.src = '';
      setStatus('', '');
    }

    async function generateQR() {
      const amount = elements.amount.value.trim();
      const qrisStatis = elements.qrisStatis.value.trim();

      hideQR();
      setStatus('', '');

      if (!/^\d+$/.test(amount) || Number(amount) <= 0) {
        elements.amount.focus();
        setStatus('Mohon isi nominal yang valid.', 'error');
        return;
      }

      if (!qrisStatis) {
        elements.qrisStatis.focus();
        setStatus('Mohon paste QRIS statis dari slip Anda.', 'error');
        return;
      }

      elements.btnGenerate.disabled = true;
      setStatus('Sedang memproses...', '');

      const corsProxies = [
        'https://api.allorigins.win/raw?url=',
        'https://corsproxy.io/?'
      ];

      async function tryFetch(proxyUrl) {
        const response = await fetch(proxyUrl + encodeURIComponent(API_URL), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            amount: amount,
            qris_statis: qrisStatis
          })
        });
        return response;
      }

      try {
        let response = await tryFetch(corsProxies[0]);
        let data = await response.json();

        if (!response.ok || data.status === 'error') {
          response = await tryFetch(corsProxies[1]);
          data = await response.json();
        }

        if (data.status === 'success' && data.qris_base64) {
          elements.qrImage.src = 'data:image/png;base64,' + data.qris_base64;
          elements.qrResult.style.display = 'block';
          setStatus(data.message || 'QRIS berhasil dihasilkan', 'success');
        } else {
          setStatus(data.message || 'Gagal generate QRIS.', 'error');
        }
      } catch (error) {
        console.error(error);
        setStatus('Gagal terhubung ke API. Cek koneksi atau CORS.', 'error');
      } finally {
        elements.btnGenerate.disabled = false;
      }
    }

    elements.btnGenerate.addEventListener('click', function() {
      generateQR();
    });

    elements.btnClear.addEventListener('click', function() {
      elements.amount.value = '10000';
      elements.qrisStatis.value = '';
      hideQR();
    });
  </script>
</body>
</html>
